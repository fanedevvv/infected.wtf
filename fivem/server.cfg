## FXServer configuration. Secrets live in secrets.cfg (see secrets.example.cfg).
## Docs: https://docs.fivem.net/docs/server-manual/setting-up-a-server/
## Listing metadata (hostname, description, tags, banners) is configured on https://portal.cfx.re/servers

exec secrets.cfg

## Network & game
endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"
sv_maxclients 48
sv_enforceGameBuild 3751 # mp2025_02 - A Safehouse in the Hills
set steam_webApiKey "none"
set resources_useSystemChat false

## Gameplay convars (setr = replicated to clients)
setr ket_nametag_template "[{{id}}] {{name}}"

## Resources — build first with `npm run build`.
## Start order also follows each fxmanifest's `dependency` list.
ensure oxmysql

ensure ket_core
ensure ket_chat
ensure ket_hud
ensure ket_nametags
ensure ket_settings
ensure ket_commands
ensure ket_admin
ensure ket_bike
ensure ket_blips

## Permissions (txAdmin / FXServer ACE). In-game admin levels are stored in users.admin.
add_ace group.admin command allow       # allow all commands
add_ace group.admin command.quit deny   # but not quit
add_principal identifier.fivem:18611340 group.admin # plwhed

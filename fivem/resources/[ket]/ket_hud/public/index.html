<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Player HUD</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main id="hud" aria-label="Player information">
        <!-- Identity: logo, name, account ID, players online -->
        <section class="chip identity">
            <img class="logo" src="assets/logo.webp" alt="" draggable="false">
            <div class="who">
                <strong id="username">Guest</strong>
                <span class="meta"><span id="account-id">#—</span><i class="sep"></i><span class="online"><i class="dot"></i><b id="online">0</b> online</span></span>
            </div>
        </section>

        <!-- Money -->
        <section class="chip money cash">
            <span class="label">CASH</span>
            <strong class="amount"><span class="currency">$</span><span id="cash">0</span></strong>
            <span id="cash-delta" class="delta" aria-live="polite"></span>
        </section>
        <section class="chip money bank">
            <span class="label">BANK</span>
            <strong class="amount"><span class="currency">$</span><span id="bank">0</span></strong>
            <span id="bank-delta" class="delta" aria-live="polite"></span>
        </section>
    </main>

    <div id="fps-counter" class="chip fps" aria-label="Frames per second">
        <strong id="fps-value">--</strong><span>FPS</span>
    </div>
</body>
</html>

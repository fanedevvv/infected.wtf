<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Speedometer</title>
    <!-- Design: Ved Speedometer (https://github.com/vedrion/ved-speedometer), MIT -->
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div id="speedo" class="container hidden">
        <div class="speedPart">
            <span id="speed" class="speed">0</span>
            <span id="unit" class="measurementType">km/h</span>
            <span class="fuel">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M4 10h11M15 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg>
                <span id="fuel" class="fuel-percentage">100</span>
            </span>
            <span class="engine-health">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12.6 12 20l-7.5-7.4A5 5 0 1 1 12 6a5 5 0 1 1 7.5 6.6Z"/><path d="M3 12h4l2-3 3 6 2-3h7"/></svg>
                <span id="engine" class="engine-health-percentage">100</span>
            </span>
        </div>
        <div class="fuel-bar"><div id="fuel-fill" class="fuel-bar-fill"></div></div>
        <div id="rpm-part" class="rpmPart"><div id="rpm" class="rpm"></div></div>
    </div>
</body>
</html>

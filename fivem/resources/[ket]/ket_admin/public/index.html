<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administration</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main id="panel" aria-hidden="true">
        <header class="topbar">
            <div class="brand">
                <span id="brand-eyebrow" class="eyebrow">SERVER CONTROL</span>
                <h1 id="brand-title">Administration</h1>
            </div>
            <div class="top-actions">
                <span id="level" class="level">ADMIN 0</span>
                <button id="close" class="icon-button" type="button" aria-label="Close menu">×</button>
            </div>
        </header>
        <div class="content">
            <nav id="categories" aria-label="Command categories"></nav>
            <section class="workspace">
                <div class="section-heading">
                    <div>
                        <span class="eyebrow">CONTROL PANEL</span>
                        <h2 id="category-title">Commands</h2>
                    </div>
                    <div class="heading-actions">
                        <input id="search" class="search" type="search" placeholder="Search vehicles…" autocomplete="off" spellcheck="false" hidden>
                        <span id="count" class="count"></span>
                    </div>
                </div>
                <p id="empty" class="empty" hidden></p>
                <div id="commands" class="commands"></div>
                <form id="command-form" class="command-form" hidden>
                    <div class="form-heading">
                        <div>
                            <span class="eyebrow">SELECTED COMMAND</span>
                            <h3 id="form-title"></h3>
                        </div>
                        <button type="button" id="cancel" class="text-button">Cancel</button>
                    </div>
                    <p id="form-description"></p>
                    <div id="fields" class="fields"></div>
                    <button class="submit-button" type="submit">Run command</button>
                </form>
            </section>
        </div>
        <footer><span id="footer-text">Commands are verified by the server before execution.</span><kbd>ESC</kbd><span>to close</span></footer>
    </main>
    <section id="support" class="support" hidden>
        <header class="topbar">
            <div class="brand">
                <span id="support-eyebrow" class="eyebrow">SUPPORT</span>
                <h1 id="support-title">Questions</h1>
            </div>
            <div class="top-actions">
                <span id="support-count" class="level"></span>
                <button id="support-close" class="icon-button" type="button" aria-label="Close">×</button>
            </div>
        </header>
        <div class="support-body">
            <p id="support-status" class="support-status" role="status" aria-live="polite" hidden></p>

            <form id="ask-form" class="ask-form" hidden>
                <p id="ask-hint" class="ask-hint"></p>
                <textarea id="ask-text" maxlength="200" rows="5" spellcheck="false"></textarea>
                <div class="ask-row">
                    <span id="ask-count" class="count">0 / 200</span>
                    <button id="ask-submit" class="submit-button" type="submit">Send</button>
                </div>
            </form>

            <div id="pending" class="pending" hidden></div>
            <div id="queue" class="queue"></div>
            <p id="queue-empty" class="empty" hidden></p>
        </div>
        <footer><span id="support-footer"></span><kbd>ESC</kbd><span>to close</span></footer>
    </section>
</body>
</html>

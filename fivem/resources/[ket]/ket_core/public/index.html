<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <div class="vignette" aria-hidden="true"></div>

    <aside class="side">
        <header class="brand">
            <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M16 2 29 12 16 30 3 12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M3 12h26M10 12l6 18 6-18M10 12l6-10 6 10" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" opacity=".55"/>
            </svg>
            <div>
                <strong id="brand-name">SAPHIREX</strong>
                <span id="brand-tagline">ROLEPLAY</span>
            </div>
        </header>

        <main class="card">
            <div class="intro">
                <h1 id="title">Welcome back</h1>
                <p id="subtitle">Sign in to continue your story in Los Santos.</p>
            </div>

            <div class="tabs" role="tablist" aria-label="Account">
                <button id="tab-login" class="tab active" type="button" role="tab" aria-selected="true">Sign in</button>
                <button id="tab-register" class="tab" type="button" role="tab" aria-selected="false">Create account</button>
                <span class="tab-indicator" aria-hidden="true"></span>
            </div>

            <form id="auth-form" novalidate autocomplete="on">
                <label class="field">
                    <span class="label">Username</span>
                    <span class="control">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                        <input id="username" name="username" type="text" minlength="3" maxlength="24" autocomplete="username" spellcheck="false" placeholder="Your username" required>
                    </span>
                </label>

                <label id="email-field" class="field" hidden>
                    <span class="label">Email address</span>
                    <span class="control">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
                        <input id="email" name="email" type="email" maxlength="254" autocomplete="email" spellcheck="false" placeholder="you@example.com">
                    </span>
                </label>

                <label class="field">
                    <span class="label">Password</span>
                    <span class="control">
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                        <input id="password" name="password" type="password" maxlength="128" autocomplete="current-password" placeholder="Your password" required>
                        <button id="reveal" class="reveal" type="button" aria-label="Show password" aria-pressed="false">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </span>
                    <span id="caps" class="hint warn" hidden>Caps Lock is on</span>
                </label>

                <div id="strength" class="strength" hidden aria-live="polite">
                    <span class="bars"><i></i><i></i><i></i><i></i></span>
                    <span id="strength-label" class="hint">At least 10 characters</span>
                </div>

                <p id="status" class="status" role="status" aria-live="polite" hidden></p>

                <button id="submit" class="submit" type="submit">
                    <span id="submit-label">Sign in</span>
                    <span class="spinner" aria-hidden="true"></span>
                    <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
            </form>
        </main>

        <footer class="footer">
            <span class="online"><i class="dot"></i><strong id="online">0</strong> online</span>
            <span class="keys"><kbd>ENTER</kbd> to continue</span>
        </footer>
    </aside>
</body>
</html>

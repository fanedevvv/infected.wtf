<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <main class="shell">
        <section class="panel">
            <div class="intro">
                <h2 id="form-title">Welcome back</h2>
                <p id="form-subtitle" class="subheading">Sign in to continue your journey.</p>
            </div>

            <div class="tabs" role="tablist" aria-label="Account options">
                <button class="tab active" id="login-tab" type="button" role="tab" aria-selected="true">Sign in</button>
                <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false">Create account</button>
            </div>

            <form id="auth-form" novalidate>
                <label for="username">Username</label>
                <input id="username" name="username" type="text" minlength="3" maxlength="24"
                    autocomplete="username" placeholder="Your username" required>

                <div id="email-field" class="field hidden">
                    <label for="email">Email address</label>
                    <input id="email" name="email" type="email" maxlength="254"
                        autocomplete="email" placeholder="you@example.com">
                </div>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" minlength="1" maxlength="128"
                    autocomplete="current-password" placeholder="Your password" required>

                <p id="status" class="status" role="status" aria-live="polite"></p>
                <button id="submit-button" class="submit-button" type="submit">Sign in</button>
            </form>
        </section>
    </main>
</body>
</html>
